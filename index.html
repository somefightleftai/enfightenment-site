<style>
:root{--bg:#0a0a0a;--bg2:#111113;--ink:#f4f1ea;--muted:#9a978f;--gold:#FCC605;--line:#222225}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{width:min(1140px,100% - 32px);margin:0 auto}
.o{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.18em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Oswald';text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:.9rem;padding:15px 30px;border-radius:4px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn-gold{background:var(--gold);color:#111;box-shadow:0 10px 30px rgba(252,198,5,.18)}
.btn-gold:hover{background:#ffd84a}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.nav img{height:42px;width:auto;display:block}
.nav .btn{padding:11px 20px;font-size:.8rem}
.hero{min-height:calc(100vh - 72px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 0 80px;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(252,198,5,.12),transparent 60%);pointer-events:none}
.hero img{position:relative;width:min(820px,92vw);height:auto;filter:drop-shadow(0 22px 50px rgba(0,0,0,.7))}
.hero .line{position:relative;margin-top:34px;color:var(--gold);font-size:clamp(.85rem,2.4vw,1.05rem)}
.hero .cta{position:relative;margin-top:34px}
#shop{padding:100px 0 110px;background:var(--bg2);border-top:1px solid var(--line)}
#shop h2{font-family:'Oswald';text-transform:uppercase;font-weight:700;font-size:clamp(2rem,5vw,3rem);letter-spacing:.02em;text-align:center}
#shop .sub{text-align:center;color:var(--muted);margin-top:10px}
.gear{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;margin-top:54px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:rgba(252,198,5,.55)}
.pimg{display:block;aspect-ratio:1/1;background:#fff;position:relative;overflow:hidden}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .35s}
.pimg img.alt{opacity:0}
.card:hover .pimg img.alt{opacity:1}
.body{padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px}
.body h3{font-family:'Oswald';text-transform:uppercase;font-size:1.35rem;letter-spacing:.04em}
.price{color:var(--gold);font-family:'Oswald';font-size:1.1rem}
.price small{color:var(--muted);font-family:'Inter';font-size:.82rem;margin-left:8px}
.body .btn{margin-top:8px;align-self:flex-start}
footer{border-top:1px solid var(--line);padding:46px 0}
.foot{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.foot img{height:40px;width:auto;display:block}
.links{display:flex;gap:26px;flex-wrap:wrap}
.links a{color:var(--muted);font-size:.78rem;transition:color .2s}
.links a:hover{color:var(--gold)}
.legal{margin-top:26px;color:#5d5b56;font-size:.8rem;text-align:center}
@media(max-width:720px){.gear{grid-template-columns:1fr}.nav img{height:34px}.foot{flex-direction:column;justify-content:center;text-align:center}.links{justify-content:center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
